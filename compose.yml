services:
  postgres:
    image: postgres:17
    ports:
      - "${PSQL_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PSQL_USER:-urlShortener-nest}
      POSTGRES_PASSWORD: ${PSQL_PASSWORD:?set PSQL_PASSWORD on .env}
      POSTGRES_DB: ${PSQL_DB:-urlShortener-nest}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
